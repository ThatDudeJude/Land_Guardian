{% extends "base.html" %} {% block title %}Forgot Password - LandGuardian{%
endblock %} {% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title mb-0">Forgot Password</h2>
        </div>
        <div class="card-body">
          <p class="text-muted">
            Enter your email address and we'll send you a link to reset your
            password.
          </p>
          <form method="post">
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                required
                placeholder="Enter your email"
              />
            </div>
            <button type="submit" class="btn btn-primary">
              Send Reset Link
            </button>
            <a href="{{ url_for('main.login') }}" class="btn btn-link"
              >Back to Login</a
            >
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
