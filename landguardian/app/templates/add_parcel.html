{% extends "base.html" %} {% block title %}Add Parcel - LandGuardian{% endblock
%} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card">
      <div class="card-header">
        <h2 class="card-title mb-0">Add New Land Parcel</h2>
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('main.add_parcel') }}">
          <div class="mb-3">
            <label for="name" class="form-label">Parcel Name</label>
            <input
              type="text"
              class="form-control"
              id="name"
              name="name"
              required
            />
          </div>
          <div class="mb-3">
            <label for="location" class="form-label"
              >Location Description</label
            >
            <input
              type="text"
              class="form-control"
              id="location"
              name="location"
              required
            />
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="latitude" class="form-label">Latitude</label>
              <input
                type="number"
                class="form-control"
                id="latitude"
                name="latitude"
                step="any"
              />
            </div>
            <div class="col-md-6 mb-3">
              <label for="longitude" class="form-label">Longitude</label>
              <input
                type="number"
                class="form-control"
                id="longitude"
                name="longitude"
                step="any"
              />
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="soil_quality" class="form-label">Soil Quality</label>
              <input
                type="number"
                class="form-control"
                id="soil_quality"
                name="soil_quality"
                min="1"
                max="10"
                required
              />
              <div class="form-text">1 = Poor, 10 = Excellent</div>
            </div>
            <div class="col-md-6 mb-3">
              <label for="vegetation_cover" class="form-label"
                >Vegetation Cover</label
              >
              <input
                type="number"
                class="form-control"
                id="vegetation_cover"
                name="vegetation_cover"
                min="1"
                max="10"
                required
              />
              <div class="form-text">1 = Bare, 10 = Dense</div>
            </div>
          </div>
          <div id="health-preview" class="mt-2 text-muted"></div>
          <div class="d-flex justify-content-end">
            <a
              href="{{ url_for('main.dashboard') }}"
              class="btn btn-outline-secondary me-2"
              >Cancel</a
            >
            <button type="submit" class="btn btn-success">Add Parcel</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %} {% block scripts %}
<script>
  document.addEventListener('DOMContentLoaded', function () {
    initFormPreview();
  });
</script>
{% endblock %}
