{% extends "base.html" %} {% block title %}Reset Password - LandGuardian{%
endblock %} {% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title mb-0">Reset Password</h2>
        </div>
        <div class="card-body">
          <p class="text-muted">Enter your new password below.</p>
          <form method="post">
            <div class="mb-3">
              <label for="password" class="form-label">New Password</label>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                required
                minlength="8"
                placeholder="Enter new password"
              />
              <div class="form-text">
                Password must be at least 8 characters and contain letters and
                numbers.
              </div>
            </div>
            <div class="mb-3">
              <label for="confirm_password" class="form-label"
                >Confirm New Password</label
              >
              <input
                type="password"
                class="form-control"
                id="confirm_password"
                name="confirm_password"
                required
                placeholder="Confirm new password"
              />
            </div>
            <button type="submit" class="btn btn-primary">
              Reset Password
            </button>
            <a href="{{ url_for('main.login') }}" class="btn btn-link"
              >Back to Login</a
            >
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
